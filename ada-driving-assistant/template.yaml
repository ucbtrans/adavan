AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ADA Driving Assistant — API Lambda + simulation scheduler

Parameters:
  AnthropicSsmParam:
    Type: String
    Default: /ada/anthropic-api-key
    Description: >-
      Name of the SecureString Parameter Store entry holding the Anthropic API
      key. The key itself is never passed to CloudFormation — the Lambda reads
      it at cold start.
  DataBucketName:
    Type: String
    Default: ada-driving-assistant
    Description: Existing S3 bucket holding city_streets.json files
  Stage:
    Type: String
    Default: prod
  Suffix:
    Type: String
    Default: ""
    Description: Name suffix for all resources. Empty for prod, "-dev" for dev.
  BucketLabel:
    Type: String
    Default: v2
    Description: Label used in web S3 bucket name. "v2" for prod, "dev" for dev.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 90
    MemorySize: 512
    Environment:
      Variables:
        S3_BUCKET:         !Ref DataBucketName
        STREETS_KEY:       CA/Berkeley/city_streets.json
        SESSIONS_TABLE:    !Ref SessionsTable
        EVENTS_TABLE:      !Ref EventsTable
        ARCHIVE_TABLE:     !Ref EventsArchiveTable
        HISTORY_TABLE:     !Ref ScheduleHistoryTable
        FLEET_TABLE:       !Sub "ada-fleet-config${Suffix}"
        REAL_VAN_TABLE:    !Sub "ada-real-van-positions${Suffix}"
        REAL_VAN_URL:      "https://ada-van-service-data.s3.us-west-1.amazonaws.com/van_position.json"
        ANTHROPIC_SSM_PARAM: !Ref AnthropicSsmParam

Resources:

  # ── HTTP API Gateway ────────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # ── API Lambda (Flask + aws-wsgi) ──────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ada-api${Suffix}"
      CodeUri: .
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsArchiveTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScheduleHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RealVanPositionsTable
        - S3ReadPolicy:
            BucketName: !Ref DataBucketName
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
                - cloudwatch:ListMetrics
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ada-fleet-config${Suffix}"
            # Read the Anthropic key from Parameter Store at cold start.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicSsmParam}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET

  # ── Simulation Lambda (daily EventBridge cron at noon UTC) ─────────────────
  SimulationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ada-simulation${Suffix}"
      CodeUri: .
      Handler: lambda_function.handler
      Timeout: 300
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ada-fleet-config${Suffix}"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 12 * * ? *)
            Name: !Sub "ada-daily-simulation${Suffix}"
            Description: Generate daily traffic events for all cities

  # ── GC Lambda (midnight PT = 07:00 UTC) ─────────────────────────────────────
  GcFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ada-gc${Suffix}"
      CodeUri: .
      Handler: gc_function.handler
      Timeout: 300
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsArchiveTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScheduleHistoryTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ada-fleet-config${Suffix}"
      Events:
        MidnightPTSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 * * ? *)
            Name: !Sub "ada-midnight-pt-gc${Suffix}"
            Description: Archive events + generate fleet schedules at midnight Pacific time

  # ── Real van position ingester (EventBridge every 1 min) ────────────────────
  RealVanIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ada-real-van-ingest${Suffix}"
      CodeUri: .
      Handler: real_van_ingest.handler
      Timeout: 60
      MemorySize: 128
      # Only one invocation at a time — overlapping runs would double-advance the
      # simulation index and interleave out-of-order points (back-and-forth).
      ReservedConcurrentExecutions: 1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RealVanPositionsTable
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Name: !Sub "ada-real-van-ingest-tick${Suffix}"
            Description: Poll the real van GPS feed and record positions

  # ── DynamoDB events table ───────────────────────────────────────────────────
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ada-events${Suffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: street,   AttributeType: S }
        - { AttributeName: event_id, AttributeType: S }
        - { AttributeName: city,     AttributeType: S }
        - { AttributeName: geohash6, AttributeType: S }
      KeySchema:
        - { AttributeName: street,   KeyType: HASH }
        - { AttributeName: event_id, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: city-index
          KeySchema:
            - { AttributeName: city,     KeyType: HASH }
            - { AttributeName: event_id, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: geohash6-index
          KeySchema:
            - { AttributeName: geohash6, KeyType: HASH }
            - { AttributeName: event_id, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── DynamoDB events archive table ──────────────────────────────────────────
  EventsArchiveTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ada-events-archive${Suffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: archive_date, AttributeType: S }
        - { AttributeName: event_id,     AttributeType: S }
        - { AttributeName: city,         AttributeType: S }
      KeySchema:
        - { AttributeName: archive_date, KeyType: HASH }
        - { AttributeName: event_id,     KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: city-date-index
          KeySchema:
            - { AttributeName: city,         KeyType: HASH }
            - { AttributeName: archive_date,  KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── DynamoDB schedule history table ─────────────────────────────────────────
  ScheduleHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ada-schedule-history${Suffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: van_id,   AttributeType: S }
        - { AttributeName: date_seq, AttributeType: S }
        - { AttributeName: date,     AttributeType: S }
      KeySchema:
        - { AttributeName: van_id,   KeyType: HASH }
        - { AttributeName: date_seq, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: date-index
          KeySchema:
            - { AttributeName: date,   KeyType: HASH }
            - { AttributeName: van_id, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── DynamoDB sessions table ─────────────────────────────────────────────────
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ada-sessions${Suffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── DynamoDB fleet config table (active vans + per-van schedules) ───────────
  FleetConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ada-fleet-config${Suffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: config_key
          AttributeType: S
      KeySchema:
        - AttributeName: config_key
          KeyType: HASH

  # ── DynamoDB real van positions (time series, ~1h TTL) ──────────────────────
  RealVanPositionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ada-real-van-positions${Suffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: van_id, AttributeType: S }
        - { AttributeName: ts,     AttributeType: S }
      KeySchema:
        - { AttributeName: van_id, KeyType: HASH }
        - { AttributeName: ts,     KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Web S3 bucket (static site: index.html + logo) ─────────────────────────
  WebBucketV2:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ada-driving-assistant-web-${BucketLabel}-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls:       false
        BlockPublicPolicy:     false
        IgnorePublicAcls:      false
        RestrictPublicBuckets: false

  WebBucketPolicyV2:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucketV2
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${WebBucketV2.Arn}/*

  # ── CloudFront distribution (HTTPS for the web bucket) ──────────────────────
  CloudFrontDistributionV2:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3WebsiteOriginV2
            DomainName: !Sub ${WebBucketV2}.s3-website-${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOriginV2
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          AllowedMethods:  [GET, HEAD]
          CachedMethods:   [GET, HEAD]

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub "ADAApiUrl${Suffix}"

  WebsiteUrlV2:
    Description: S3 static website URL
    Value: !GetAtt WebBucketV2.WebsiteURL
    Export:
      Name: !Sub "ADAWebsiteUrlV2${Suffix}"

  CloudFrontUrlV2:
    Description: HTTPS CloudFront URL
    Value: !Sub https://${CloudFrontDistributionV2.DomainName}
    Export:
      Name: !Sub "ADACloudFrontUrlV2${Suffix}"

  WebBucketNameV2:
    Description: Web S3 bucket name
    Value: !Ref WebBucketV2
    Export:
      Name: !Sub "ADAWebBucketV2${Suffix}"

  EventsTableArn:
    Description: DynamoDB events table ARN
    Value: !GetAtt EventsTable.Arn
    Export:
      Name: !Sub "ADAEventsTableArn${Suffix}"
